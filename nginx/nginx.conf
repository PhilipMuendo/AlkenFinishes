server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Security headers (CSP allows recharts' inline styles; no inline scripts)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
    }

    # ZKTeco/ADMS fingerprint terminals push attendance here.
    location /iclock/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hashed filenames, so these can be cached forever.
    location /assets/ {
        # nginx drops inherited add_header directives as soon as a location
        # sets one of its own, so the security headers are repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry point and the service worker must NOT be cached.
    #
    # With no Cache-Control at all, a browser applies heuristic freshness and
    # can serve these from cache without revalidating. For sw.js that is the
    # whole problem: if the browser does not re-fetch the worker it never
    # learns an update exists, autoUpdate never fires, and a deploy simply does
    # not reach the user until they hard-refresh. Every deploy, silently.
    location = /index.html {
        # nginx drops inherited add_header directives as soon as a location
        # sets one of its own, so the security headers are repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        # nginx drops inherited add_header directives as soon as a location
        # sets one of its own, so the security headers are repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    location = /registerSW.js {
        # nginx drops inherited add_header directives as soon as a location
        # sets one of its own, so the security headers are repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        # nginx drops inherited add_header directives as soon as a location
        # sets one of its own, so the security headers are repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
